# GR-001 §4 — rule-only text used when the LLM output fails safety twice or the LLM is unavailable.
# Must itself pass safety_check (tested in tests/test_fallback.py).
version: "1.0.0"

diet:
  portion_guidance: >-
    Use the plate method: fill half your plate with non-starchy vegetables, a quarter with protein
    and a quarter with whole grains or other starchy foods. Use a 9-inch (23 cm) plate.
  hydration: >-
    Drink water through the day — about 8 glasses for most adults unless your doctor has advised a
    fluid limit. Avoid sugary drinks, sweetened tea and coffee, and fruit juice.
  foods_to_eat:
    all:
      - non-starchy vegetables
      - "whole grains such as oats, millets and brown rice"
      - pulses and lentils
      - whole fruit in small portions
      - nuts and seeds in small amounts
    non_vegetarian: [fish, skinless chicken]
    vegetarian: [low-fat curd or yogurt, paneer in small amounts]
    vegan: [tofu, soy milk without added sugar]
  foods_to_avoid:
    - sugary drinks and fruit juice
    - sweets and desserts
    - refined flour (maida) products
    - deep-fried snacks
    - white bread and large portions of white rice
    - processed meats
  meals:
    breakfast:
      - name: Vegetable oats
        description: Oats cooked with mixed vegetables.
        portion: "1 bowl (about 40 g dry oats)"
      - name: Whole-grain toast with vegetables
        description: "Two slices of whole-grain bread with tomato, cucumber and a protein that fits your diet."
        portion: 2 slices
    lunch:
      - name: Dal with vegetables and grains
        description: Lentil dal with a large serving of vegetables and a small portion of whole grains.
        portion: "Half plate vegetables, quarter plate dal, quarter plate grains"
      - name: Bean and vegetable bowl
        description: Beans or chickpeas with salad vegetables and a small portion of brown rice.
        portion: 1 bowl
    dinner:
      - name: Vegetable stir-fry with protein
        description: Mixed vegetables cooked with little oil and a protein that fits your diet.
        portion: 1 plate using the plate method
      - name: Vegetable soup and salad
        description: Thick vegetable and lentil soup with a side salad.
        portion: "1 large bowl and 1 side plate"
    snacks:
      - name: Roasted chana
        description: Roasted chickpeas.
        portion: "1 small handful (30 g)"
      - name: Fruit and nuts
        description: One small whole fruit with a few nuts.
        portion: "1 fruit and 5–6 nuts"

lifestyle:
  exercise:
    - Aim for at least 150 minutes of moderate activity a week, such as brisk walking, spread over at least 3 days.
    - Add muscle-strengthening activity, such as bodyweight exercises, on 2 days a week.
  walking_goal: Build up to a 30-minute brisk walk on 5 days a week; a short walk after meals also helps blood glucose.
  weight_management: If your weight is above the healthy range, a gradual loss of 5–7% of body weight brings real benefits.
  sleep: Aim for 7–9 hours of sleep with regular sleep and wake times.
  stress:
    - Try 5 minutes of slow breathing once or twice a day.
    - Take short breaks and spend time outdoors or with people you enjoy.
  behaviour_change:
    - "Set one small, specific goal each week and track it."
    - Plan meals and keep healthy snacks within easy reach.

narrative:
  summary_template: >-
    Your HbA1c of {hba1c}% is {label_lower}. {risk_sentence} This report suggests practical food,
    activity and monitoring steps you can discuss with your doctor.
  preventive_actions:
    - Keep up regular physical activity and limit time spent sitting.
    - Choose whole, minimally processed foods and avoid sugary drinks.
    - Keep your recommended check-ups and tests on schedule.
  doctor_questions:
    - What does my HbA1c result mean for me, and do I need a repeat test to confirm it?
    - What HbA1c and weight targets should I aim for?
    - Which of the tests in this report do I need, and how often?
