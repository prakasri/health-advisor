[project]
name = "health-advisor-api"
version = "0.1.0"
description = "Diabetes assessment API: rules engine + LangGraph recommendations"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "arize-phoenix-otel>=0.17.2",
    "fastapi>=0.143.0",
    "jsonschema>=4.26.0",
    "langchain-anthropic>=1.7.5",
    "langgraph>=1.2.14",
    "openinference-instrumentation-langchain>=0.1.79",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "arize-phoenix>=20.20.0",
    "datamodel-code-generator>=0.83.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-bdd>=9.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.ruff]
extend-exclude = ["app/schemas/assessment_input.py", "app/schemas/report.py"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
